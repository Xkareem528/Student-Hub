<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090817">
  <meta name="robots" content="noindex, nofollow">
  <title>EDU SOLVER | صيانة مؤقتة</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 0%,#29204b 0%,#090817 58%);color:#f5f1ff;font-family:Cairo, sans-serif;text-align:center}
    .card{width:min(100%,520px);padding:42px 26px;border:1px solid #ffffff1c;border-radius:26px;background:#151226d9;box-shadow:0 24px 80px #0006}
    .logo{font-size:19px;font-weight:900;letter-spacing:2px;color:#bca7ff}.rocket{font-size:58px;display:block;margin:22px auto;animation:float 2.8s ease-in-out infinite}
    h1{font-size:clamp(25px,6vw,36px);margin:8px 0 12px}p{margin:0;color:#c5bfd8;line-height:2;font-size:15px}.line{height:4px;width:90px;margin:26px auto 0;border-radius:9px;background:linear-gradient(90deg,#8b5cf6,#22d3ee)}
    @keyframes float{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-10px) rotate(5deg)}}
    @media(prefers-reduced-motion:reduce){.rocket{animation:none}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">EDU SOLVER</div>
    <span class="rocket" aria-hidden="true">🚀</span>
    <h1>نقوم ببعض التحسينات</h1>
    <p>الموقع مغلق مؤقتًا للصيانة والتطوير.<br>هنرجع قريب بتجربة أفضل بإذن الله.</p>
    <div class="line"></div>
  </main>
</body>
</html>
