<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050b1b">
  <meta name="robots" content="noindex, nofollow">
  <title>EDU SOLVER | صيانة وتطوير</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--cyan:#35c5ff;--blue:#287cff;--violet:#9a7cff;--muted:#9db1d2}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;display:grid;place-items:center;overflow:hidden;padding:24px;background:#030817;color:#f4f8ff;font-family:Cairo,Tahoma,sans-serif}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.24;background-image:linear-gradient(#3d8fff12 1px,transparent 1px),linear-gradient(90deg,#3d8fff12 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
    .aurora{position:fixed;width:48vw;height:48vw;min-width:340px;min-height:340px;border-radius:50%;filter:blur(90px);opacity:.19;pointer-events:none;animation:aurora 12s ease-in-out infinite alternate}
    .aurora.a{background:#145dff;top:-24%;right:-12%}.aurora.b{background:#713cff;bottom:-30%;left:-15%;animation-delay:-5s}
    .stars,.stars:before,.stars:after{position:fixed;inset:0;pointer-events:none;background-repeat:repeat;background-image:radial-gradient(2px 2px at 20px 30px,#b9e6ff99 50%,transparent 55%),radial-gradient(1px 1px at 90px 80px,#fff9 50%,transparent 55%),radial-gradient(1.5px 1.5px at 150px 130px,#78caff99 50%,transparent 55%);background-size:210px 190px;animation:star-drift 34s linear infinite;opacity:.45}
    .stars:before,.stars:after{content:"";transform:translateY(-100%);animation-duration:48s;opacity:.55}.stars:after{transform:translateY(100%);animation-duration:62s;opacity:.3}
    .shell{position:relative;z-index:1;width:min(100%,650px);text-align:center;animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:26px;color:#eaf4ff;font-size:15px;font-weight:900;letter-spacing:3px}
    .brand-mark{width:35px;height:35px;display:grid;place-items:center;border:1px solid #43baff66;border-radius:12px;background:linear-gradient(145deg,#168fff44,#8b5cf633);box-shadow:0 0 28px #168fff35;color:#8bdcff;font-size:17px}
    .card{position:relative;overflow:hidden;padding:clamp(28px,6vw,54px) clamp(20px,6vw,54px);border:1px solid #398bdb55;border-radius:30px;background:linear-gradient(145deg,#0c1c38ed,#080f22f5 62%,#10112bed);box-shadow:0 30px 100px #0009,0 0 70px #087dff16,inset 0 1px #ffffff13;backdrop-filter:blur(18px)}
    .card:before{content:"";position:absolute;inset:-1px auto auto 10%;width:80%;height:1px;background:linear-gradient(90deg,transparent,#56c9ff,transparent);box-shadow:0 0 24px #35baff}
    .visual{position:relative;width:190px;height:190px;margin:0 auto 18px;display:grid;place-items:center}
    .orbit{position:absolute;inset:10px;border:1px solid #3a9cff55;border-radius:50%;animation:spin 13s linear infinite}
    .orbit:before,.orbit:after{content:"";position:absolute;width:9px;height:9px;border-radius:50%;background:#6bdcff;box-shadow:0 0 16px #39baff;top:17px;left:24px}
    .orbit:after{width:6px;height:6px;top:auto;left:auto;right:10px;bottom:42px;background:#a995ff;box-shadow:0 0 14px #9275ff}
    .orbit.two{inset:27px;border-style:dashed;border-color:#9878ff66;animation:spin 19s linear infinite reverse}
    .orbit.two:before{background:#a995ff;top:auto;bottom:8px;left:50%}
    .core{width:92px;height:92px;display:grid;place-items:center;border:1px solid #56bfff77;border-radius:28px;background:linear-gradient(145deg,#123d70,#151b46);box-shadow:0 0 0 12px #238bff0b,0 0 48px #168fff55,inset 0 1px #ffffff35;font-size:42px;animation:core-float 3.6s ease-in-out infinite}
    .status{display:inline-flex;align-items:center;gap:9px;margin:0 auto 17px;padding:8px 14px;border:1px solid #218ee866;border-radius:99px;background:#087dff14;color:#8bd6ff;font-size:10px;font-weight:900;letter-spacing:1.5px}
    .status i{width:7px;height:7px;border-radius:50%;background:#47d7ff;box-shadow:0 0 12px #47d7ff;animation:pulse 1.4s ease-in-out infinite}
    h1{margin:0;color:#f4f8ff;font-size:clamp(27px,6vw,43px);font-weight:900;line-height:1.45}
    h1 span{background:linear-gradient(90deg,#56caff,#9a8bff 60%,#c6a5ff);background-clip:text;-webkit-background-clip:text;color:transparent}
    .message{max-width:470px;margin:14px auto 0;color:#b3c4df;font-size:14px;line-height:2.1;overflow-wrap:anywhere}
    .progress{height:5px;max-width:310px;margin:28px auto 13px;overflow:hidden;border-radius:20px;background:#ffffff12}
    .progress span{display:block;width:38%;height:100%;border-radius:20px;background:linear-gradient(90deg,#168fff,#56d5ff,#a78bfa);box-shadow:0 0 18px #36aaff;animation:loading 2.4s ease-in-out infinite}
    .hint{margin:0;color:#7189ae;font-size:10px;letter-spacing:.5px}
    .footer{margin-top:22px;color:#62799d;font-size:10px;letter-spacing:2px}
    @keyframes enter{from{opacity:0;transform:translateY(24px) scale(.98);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes core-float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
    @keyframes loading{0%{transform:translateX(260%)}100%{transform:translateX(-280%)}}
    @keyframes star-drift{to{background-position:0 190px,0 190px,0 190px}}
    @keyframes aurora{to{transform:translate(7vw,5vh) scale(1.15)}}
    @media(max-width:480px){body{padding:16px}.visual{width:160px;height:160px}.core{width:78px;height:78px;font-size:35px}.card{border-radius:23px}.brand{margin-bottom:18px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="aurora a"></div><div class="aurora b"></div><div class="stars"></div>
  <main class="shell">
    <div class="brand"><span class="brand-mark">✦</span><span>EDU SOLVER</span></div>
    <section class="card" aria-labelledby="maintenance-title">
      <div class="visual" aria-hidden="true">
        <div class="orbit"></div><div class="orbit two"></div>
        <div class="core">⚙️</div>
      </div>
      <div class="status"><i></i> SYSTEM UPGRADE IN PROGRESS</div>
      <h1 id="maintenance-title">نجهّز لك تجربة <span>أفضل</span></h1>
      <p class="message" id="maintenance-message">الموقع مغلق مؤقتًا للصيانة والتطوير. هنرجع قريب بتجربة أفضل بإذن الله.</p>
      <div class="progress" aria-hidden="true"><span></span></div>
      <p class="hint">شكرًا لصبرك وثقتك في EDU SOLVER</p>
    </section>
    <footer class="footer">© <span id="year"></span> EDU SOLVER · BACK SOON</footer>
  </main>
  <script>
    const API = "https://student-hub.kareemahmedhussein4.workers.dev/api/site-settings";
    const message = new URLSearchParams(location.search).get("message");
    if (message) document.querySelector("#maintenance-message").textContent = message;
    document.querySelector("#year").textContent = new Date().getFullYear();

    // Return visitors to the site automatically after maintenance is disabled.
    async function checkMaintenance() {
      try {
        const response = await fetch(API, { cache: "no-store" });
        const data = await response.json();
        if (response.ok && data.ok && !data.maintenance?.enabled) {
          location.replace("/");
        }
      } catch {}
    }
    checkMaintenance();
    setInterval(checkMaintenance, 12000);
  </script>
</body>
</html>
